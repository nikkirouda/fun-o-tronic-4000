<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f0e17">
<meta name="description" content="What's on in Providence and across Rhode Island — theater, music, film, talks, sports and more, in one place.">
<title>Fun-o-tronic 4000</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff8906'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%230f0e17'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23f25f4c'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="masthead">
  <div class="brand">
    <span class="dial" aria-hidden="true"><span></span></span>
    <h1>Fun<span class="o">-o-</span>tronic <span class="num">4000</span></h1>
  </div>
  <div class="status" id="status" title="When the listings were last refreshed">
    <span class="led" id="led"></span><span id="statusText">warming up…</span>
  </div>
  <div class="masthead-actions">
    <button class="icon-btn" id="btnNew" title="New since your last visit" aria-label="What's new"><span class="ico">✦</span><span class="badge" id="newCount" hidden></span></button>
    <button class="icon-btn" id="btnStars" title="Your picks" aria-label="Your picks">★<span class="badge" id="starCount" hidden></span></button>
    <button class="icon-btn" id="btnTheme" title="Light / dark" aria-label="Toggle theme">◐</button>
    <button class="icon-btn" id="btnMore" title="Subscribe & settings" aria-label="Settings">⋯</button>
  </div>
</header>

<nav class="panel" aria-label="Filters">
  <div class="search-row">
    <input type="search" id="q" placeholder="Search shows, bands, venues, 'jazz', 'free'…" autocomplete="off" aria-label="Search">
    <button class="surprise" id="btnSurprise" title="Pick something for me">🎲 Surprise me</button>
  </div>

  <div class="chips when" id="whenChips" role="tablist" aria-label="When">
    <button data-when="tonight">Tonight</button>
    <button data-when="tomorrow">Tomorrow</button>
    <button data-when="weekend" class="on">This weekend</button>
    <button data-when="week">Next 7 days</button>
    <button data-when="month">30 days</button>
    <button data-when="all">Everything</button>
    <button data-when="custom" id="customWhen">Dates…</button>
  </div>
  <div class="custom-range" id="customRange" hidden>
    <label>From <input type="date" id="fromDate"></label>
    <label>To <input type="date" id="toDate"></label>
  </div>

  <div class="chips cats" id="catChips" aria-label="Categories"></div>

  <div class="toggles">
    <label class="tog"><input type="checkbox" id="freeOnly"> Free only</label>
    <label class="tog"><input type="checkbox" id="hideKids" checked> Hide kids &amp; family</label>
    <label class="tog"><input type="checkbox" id="ticketsOnly"> Has tickets</label>
    <label class="tog price">Max $<input type="number" id="maxPrice" min="0" step="5" placeholder="any" inputmode="numeric"></label>
    <select id="areaSel" aria-label="Area">
      <option value="">Anywhere in RI</option>
      <option value="hill">College Hill &amp; East Side</option>
      <option value="pvd">Providence</option>
      <option value="metro">Providence metro</option>
      <option value="newport">Newport &amp; the islands</option>
      <option value="south">South County &amp; Westerly</option>
      <option value="north">Blackstone Valley &amp; north</option>
    </select>
    <select id="venueSel" aria-label="Venue"><option value="">Any venue</option></select>
    <button class="linkish" id="btnReset">reset</button>
  </div>
</nav>

<div class="viewbar">
  <div class="seg" role="tablist" aria-label="View">
    <button data-view="list" class="on">List</button>
    <button data-view="cal">Calendar</button>
    <button data-view="map">Map</button>
  </div>
  <div class="count" id="count"></div>
  <select id="sortSel" aria-label="Sort">
    <option value="time">Soonest first</option>
    <option value="new">Newest listings</option>
    <option value="price">Cheapest first</option>
    <option value="az">A → Z</option>
  </select>
</div>

<main id="main">
  <section id="listView" class="view"></section>
  <section id="calView" class="view" hidden>
    <div class="cal-head">
      <button id="calPrev" aria-label="Previous month">‹</button>
      <h2 id="calTitle"></h2>
      <button id="calNext" aria-label="Next month">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div id="calDay"></div>
  </section>
  <section id="mapView" class="view" hidden>
    <div id="map"></div>
    <p class="hint">Tap a pin for that venue's upcoming shows. Pins are sized by how much is on.</p>
  </section>
</main>

<footer class="foot">
  <p><strong>Fun-o-tronic 4000</strong> gathers listings from <span id="srcCount">—</span> Rhode Island sources. Dates and prices come from the venues; always check the ticket page before you go.
  <a href="#" id="btnSources">Sources &amp; health</a> · <a href="feed.ics" id="feedLink">Calendar feed</a></p>
</footer>

<!-- Event detail sheet -->
<div class="sheet-backdrop" id="backdrop" hidden></div>
<aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></aside>

<!-- Toast -->
<div class="toast" id="toast" hidden></div>

<template id="tplCard">
  <article class="card" tabindex="0">
    <div class="when"><span class="t"></span><span class="d"></span></div>
    <div class="body">
      <div class="top">
        <span class="cat"></span>
        <span class="flags"></span>
      </div>
      <h3 class="title"></h3>
      <div class="where"></div>
      <p class="sum"></p>
    </div>
    <button class="star" aria-label="Save">☆</button>
  </article>
</template>

<script src="app.js" defer></script>
</body>
</html>
