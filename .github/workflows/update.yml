name: Refresh listings & deploy

on:
  schedule:
    - cron: "0 10 * * 1,4"   # Mon & Thu 10:00 UTC = 5 AM EST / 6 AM EDT, an hour before each digest (Captain's word 2026-11-07)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "state/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          TZ: America/New_York
        run: python build.py
      - name: Commit data
        run: |
          git config user.name "fun-o-tronic bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data site/feed.ics state
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs origin main || true
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
