name: Refresh listings & deploy

on:
  schedule:
    - cron: "0 10 * * 1,4"   # Mon & Thu 10:00 UTC = 5 AM EST / 6 AM EDT, an hour before each digest (Captain's word 2026-11-07)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "state/**"]

# Least privilege (security review 2026-11-09): nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # only the "Commit data" step uses it
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # scrapers and pip never see the write token
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt   # exact versions, hash-checked; edit requirements.in and re-run pip-compile --generate-hashes
      - name: Scrape
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          TZ: America/New_York
        run: python build.py
      - name: Commit data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config core.hooksPath /dev/null   # no hook planted during the scrape runs with the token
          git config user.name "fun-o-tronic bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data site/feed.ics state
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs "$remote" main || true
          git push "$remote" HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
